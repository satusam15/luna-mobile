<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Luna</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    touch-action: none;
  }
  #face {
    display: block;
    width: 100vw;
    height: 100vh;
    background: #000;
  }
  /* One invisible full-screen tap target to satisfy the browser's
     "user gesture required" rule for mic/camera/audio permissions */
  #start-overlay {
    position: fixed;
    inset: 0;
    background: #000;
    color: #444;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: sans-serif;
    font-size: 14px;
    z-index: 10;
  }
</style>
</head>
<body>
  <canvas id="face"></canvas>
  <div id="start-overlay">tap to wake Luna</div>

  <script src="/static/app.js"></script>
</body>
</html>
